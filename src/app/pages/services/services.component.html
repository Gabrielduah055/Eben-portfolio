<div class="pt-16">

  <!-- Hero -->
  <section class="py-20 md:py-24 px-6 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-80 h-80 bg-accent/5 rounded-full blur-3xl pointer-events-none"></div>
    <div class="max-w-5xl mx-auto fade-up">
      <div class="max-w-3xl">
        <span class="label block mb-5">{{ content.label }}</span>
        <h1 class="text-4xl sm:text-5xl lg:text-[3.25rem] font-normal text-text-primary leading-[1.12] mb-6 tracking-normal">
          {{ content.heading }}
        </h1>
        <p class="text-text-secondary text-base leading-7 max-w-2xl">{{ content.subtext }}</p>
      </div>
    </div>
  </section>

  <!-- Services List -->
  <section class="py-12 md:py-16 px-6">
    <div class="max-w-5xl mx-auto divide-y divide-white/[0.06] fade-up fade-up-delay-1">
      <article *ngFor="let service of services; let i = index" class="group smooth-card py-9 first:pt-0 last:pb-0">
        <div class="grid grid-cols-1 lg:grid-cols-[0.55fr_1.45fr] gap-7 lg:gap-10">
          <div class="flex items-start gap-4">
            <span class="text-accent/30 text-3xl font-normal leading-none">{{ (i + 1).toString().padStart(2, '0') }}</span>
            <span class="service-icon" aria-hidden="true">
              <i [class]="service.icon"></i>
            </span>
          </div>

          <div>
            <h2 class="text-text-primary font-medium text-xl mb-3 group-hover:text-accent transition-colors duration-200">{{ service.title }}</h2>
            <p class="text-text-secondary text-base leading-7 mb-7 max-w-3xl">{{ service.description }}</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <p class="label mb-3">What's Included</p>
                <ul class="space-y-2.5">
                  <li *ngFor="let item of service.includes" class="flex items-start gap-2.5 text-text-secondary text-sm leading-6">
                    <i class="uil uil-check text-accent text-base mt-0.5"></i>
                    <span>{{ item }}</span>
                  </li>
                </ul>
              </div>

              <div class="border border-white/[0.06] rounded-xl p-5 bg-bg-secondary/50">
                <p class="label mb-2">Expected Outcome</p>
                <p class="text-text-secondary text-sm leading-7">{{ service.outcome }}</p>
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </section>

  <app-cta-section
    [heading]="content.cta.heading"
    [body]="content.cta.body"
    [button]="content.cta.button"
    link="/contact">
  </app-cta-section>
</div>
