<div class="pt-[72px]">
  <section class="page-section">
    <div class="shell fade-up">
      <p class="label mb-5">{{ content.label }}</p>
      <h1 class="max-w-4xl font-display text-5xl font-semibold leading-[1.02] tracking-[-0.045em] text-text-primary sm:text-6xl">{{ content.heading }}</h1>
      <p class="mt-6 max-w-2xl text-base leading-8 text-text-secondary md:text-lg">{{ content.subtext }}</p>
    </div>
  </section>

  <section class="pb-20 md:pb-28">
    <div class="shell grid grid-cols-1 gap-5 lg:grid-cols-2">
      <article *ngFor="let service of services" class="panel group flex flex-col p-6 transition duration-300 hover:-translate-y-1 hover:border-accent/60 md:p-8">
        <div class="flex items-start justify-between gap-5">
          <span class="service-icon"><i [class]="service.icon" aria-hidden="true"></i></span>
          <i class="uil uil-arrow-up-right text-xl text-text-muted transition-colors group-hover:text-accent" aria-hidden="true"></i>
        </div>
        <h2 class="mt-8 text-xl font-bold tracking-tight text-text-primary">{{ service.title }}</h2>
        <p class="mt-3 text-sm leading-7 text-text-secondary">{{ service.description }}</p>
        <div class="mt-7 flex flex-wrap gap-2">
          <span *ngFor="let item of service.includes" class="rounded-full bg-bg-secondary px-3 py-1.5 text-xs font-medium text-text-secondary">{{ item }}</span>
        </div>
        <p class="mt-7 border-l-2 border-accent pl-4 text-sm leading-7 text-text-muted">{{ service.outcome }}</p>
      </article>
    </div>
  </section>

  <app-cta-section
    [heading]="content.cta.heading"
    [body]="content.cta.body"
    [button]="content.cta.button"
    link="/contact">
  </app-cta-section>
</div>
