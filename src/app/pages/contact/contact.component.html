<div class="pt-[72px]">
  <section class="flex min-h-[calc(100dvh-72px)] items-center py-16 md:py-20">
    <div class="shell grid grid-cols-1 items-center gap-12 lg:grid-cols-[1.05fr_0.95fr] lg:gap-20">
      <div class="fade-up">
        <p class="label mb-5">{{ content.label }}</p>
        <h1 class="max-w-3xl font-display text-5xl font-semibold leading-[1.02] tracking-[-0.045em] text-text-primary sm:text-6xl">{{ content.heading }}</h1>
        <p class="mt-6 max-w-xl text-base leading-8 text-text-secondary md:text-lg">{{ content.subtext }}</p>

        <a [href]="'mailto:' + site.email" class="mt-9 flex max-w-xl items-center justify-between gap-5 rounded-2xl border border-border-subtle bg-surface/80 p-5 transition duration-300 hover:-translate-y-1 hover:border-accent sm:p-6">
          <span class="flex min-w-0 items-center gap-4">
            <span class="service-icon flex-none"><i class="uil uil-envelope" aria-hidden="true"></i></span>
            <span class="min-w-0">
              <span class="block text-xs font-semibold text-text-muted">{{ content.emailLabel }}</span>
              <span class="mt-1 block truncate text-sm font-bold text-text-primary sm:text-base">{{ site.email }}</span>
            </span>
          </span>
          <i class="uil uil-arrow-up-right flex-none text-xl text-accent" aria-hidden="true"></i>
        </a>
        <p class="mt-3 text-sm text-text-muted">{{ content.response }}</p>

        <div class="mt-9">
          <p class="mb-4 text-sm font-bold text-text-primary">Connect on social</p>
          <app-social-links [showLabels]="true"></app-social-links>
        </div>
      </div>

      <div class="fade-up fade-up-delay-1 lg:justify-self-end">
        <div class="max-w-[28rem] overflow-hidden rounded-2xl border border-border-subtle bg-surface">
          <img src="/assets/ebenezer-professional.jpg" alt="Ebenezer Amankwaa dressed professionally" class="aspect-[4/5] w-full object-cover object-[center_18%]">
          <div class="border-t border-border-subtle p-5">
            <p class="text-lg font-bold text-text-primary">Ebenezer Amankwaa</p>
            <p class="mt-1 text-sm text-text-secondary">Digital Marketer & Content Creator</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
