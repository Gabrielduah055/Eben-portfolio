<div class="pt-[72px]">
  <section class="page-section">
    <div class="shell fade-up">
      <p class="label mb-5">{{ content.label }}</p>
      <h1 class="max-w-4xl font-display text-5xl font-semibold leading-[1.02] tracking-[-0.045em] text-text-primary sm:text-6xl">{{ content.heading }}</h1>
      <p class="mt-6 max-w-2xl text-base leading-8 text-text-secondary md:text-lg">{{ content.subtext }}</p>
    </div>
  </section>

  <section class="pb-20 md:pb-28">
    <div class="shell grid grid-cols-1 gap-4 md:grid-cols-12 md:grid-rows-2">
      <figure class="group overflow-hidden rounded-2xl border border-border-subtle bg-surface md:col-span-7 md:row-span-2">
        <img src="/assets/ebenezer-relaxed.jpg" alt="Ebenezer smiling in a relaxed setting" class="image-hover h-full min-h-[32rem] w-full object-cover object-center" loading="eager">
      </figure>
      <figure class="group overflow-hidden rounded-2xl border border-border-subtle bg-surface md:col-span-5">
        <img src="/assets/ebenezer-travel.jpg" alt="Ebenezer on a day out" class="image-hover aspect-[4/3] h-full w-full object-cover object-[center_38%]" loading="lazy">
      </figure>
      <figure class="group overflow-hidden rounded-2xl border border-border-subtle bg-surface md:col-span-5">
        <img src="/assets/ebenezer-professional.jpg" alt="Ebenezer dressed in a blue suit" class="image-hover aspect-[4/3] h-full w-full object-cover object-[center_20%]" loading="lazy">
      </figure>
    </div>
  </section>

  <section class="page-section border-y border-border-subtle bg-bg-secondary/70">
    <div class="shell">
      <h2 class="max-w-2xl font-display text-3xl font-semibold tracking-[-0.03em] text-text-primary sm:text-4xl">{{ content.blurb }}</h2>
      <div class="mt-12 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-[1.2fr_0.8fr_1fr]">
        <article *ngFor="let moment of moments" class="rounded-2xl border border-border-subtle bg-surface/70 p-6">
          <h3 class="font-bold text-text-primary">{{ moment.title }}</h3>
          <p class="mt-3 text-sm leading-7 text-text-secondary">{{ moment.text }}</p>
        </article>
      </div>
    </div>
  </section>

  <section class="page-section">
    <div class="shell grid grid-cols-1 gap-8 lg:grid-cols-[0.75fr_1.25fr] lg:items-center">
      <div>
        <h2 class="font-display text-3xl font-semibold tracking-[-0.03em] text-text-primary sm:text-4xl">{{ content.social.heading }}</h2>
        <p class="mt-4 max-w-lg text-sm leading-7 text-text-secondary">{{ content.social.body }}</p>
      </div>
      <app-social-links [showLabels]="true"></app-social-links>
    </div>
  </section>
</div>
