<footer class="border-t border-border-subtle bg-bg-secondary/85">
  <div class="shell py-14 md:py-16">
    <div class="grid grid-cols-1 gap-12 lg:grid-cols-[1.3fr_0.7fr_1fr]">
      <div>
        <a routerLink="/" class="inline-flex items-center gap-3">
          <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-accent text-sm font-extrabold text-[#f8f9fd]">EA</span>
          <span>
            <span class="block font-bold text-text-primary">{{ site.name }}</span>
            <span class="block text-sm text-text-muted">{{ site.tagline }}</span>
          </span>
        </a>
        <p class="mt-5 max-w-md text-sm leading-7 text-text-secondary">{{ footer.tagline }}</p>
        <div class="mt-6">
          <app-social-links size="sm"></app-social-links>
        </div>
      </div>

      <nav aria-label="Footer navigation">
        <h2 class="mb-4 text-sm font-bold text-text-primary">Explore</h2>
        <ul class="grid grid-cols-2 gap-x-5 gap-y-3 lg:grid-cols-1">
          <li *ngFor="let link of links">
            <a [routerLink]="link.path" class="text-sm text-text-secondary transition-colors hover:text-accent">{{ link.label }}</a>
          </li>
        </ul>
      </nav>

      <div>
        <h2 class="text-2xl font-display font-semibold tracking-tight text-text-primary">Have an opportunity in mind?</h2>
        <p class="mt-3 text-sm leading-7 text-text-secondary">For junior marketing roles, content support, and creative collaborations.</p>
        <a routerLink="/contact" class="btn-primary mt-6">Get in touch <i class="uil uil-arrow-up-right"></i></a>
      </div>
    </div>

    <div class="mt-12 flex flex-col gap-3 border-t border-border-subtle pt-6 sm:flex-row sm:items-center sm:justify-between">
      <p class="text-xs text-text-muted">{{ footer.copyright }}</p>
      <a [href]="'mailto:' + site.email" class="text-xs font-medium text-text-secondary transition-colors hover:text-accent">{{ site.email }}</a>
    </div>
  </div>
</footer>
