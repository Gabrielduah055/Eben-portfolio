<nav class="fixed inset-x-0 top-0 z-50 border-b border-border-subtle bg-bg-primary/90 backdrop-blur-xl">
  <div class="shell flex h-[72px] items-center justify-between">
    <a routerLink="/" class="group flex min-w-0 items-center gap-3" aria-label="Ebenezer Amankwaa home">
      <span class="flex h-10 w-10 flex-none items-center justify-center rounded-xl bg-accent text-sm font-extrabold tracking-tight text-[#f8f9fd]">EA</span>
      <span class="min-w-0 leading-tight">
        <span class="block truncate text-sm font-bold text-text-primary transition-colors group-hover:text-accent">{{ site.name }}</span>
        <span class="hidden text-xs text-text-muted sm:block">Digital Marketer</span>
      </span>
    </a>

    <ul class="hidden items-center gap-6 lg:flex">
      <li *ngFor="let link of links">
        <a [routerLink]="link.path" class="nav-link py-2" [class.active]="isActive(link.path)">
          {{ link.label }}
        </a>
      </li>
    </ul>

    <a routerLink="/contact" class="btn-primary hidden px-5 py-2.5 lg:inline-flex">Get in touch</a>

    <button
      type="button"
      (click)="toggleMobile()"
      class="flex h-11 w-11 flex-col items-center justify-center gap-1.5 rounded-full border border-border-subtle bg-surface/70 lg:hidden"
      [attr.aria-expanded]="mobileOpen"
      aria-controls="mobile-navigation"
      aria-label="Toggle navigation">
      <span class="block h-0.5 w-5 rounded-full bg-text-primary transition-transform" [class.translate-y-2]="mobileOpen" [class.rotate-45]="mobileOpen"></span>
      <span class="block h-0.5 w-5 rounded-full bg-text-primary transition-opacity" [class.opacity-0]="mobileOpen"></span>
      <span class="block h-0.5 w-5 rounded-full bg-text-primary transition-transform" [class.-translate-y-2]="mobileOpen" [class.-rotate-45]="mobileOpen"></span>
    </button>
  </div>

  <div *ngIf="mobileOpen" id="mobile-navigation" class="border-t border-border-subtle bg-bg-secondary lg:hidden">
    <div class="shell flex flex-col py-5">
      <a
        *ngFor="let link of links"
        [routerLink]="link.path"
        class="border-b border-border-subtle py-3.5 text-base font-medium text-text-secondary last:border-0"
        [class.text-accent]="isActive(link.path)">
        {{ link.label }}
      </a>
      <a routerLink="/contact" class="btn-primary mt-5 w-full">Get in touch</a>
    </div>
  </div>
</nav>
